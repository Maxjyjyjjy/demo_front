<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#285f80",
                        "secondary": "#2f6a3f",
                        "on-primary-fixed-variant": "#0c4b6c",
                        "inverse-primary": "#9accf3",
                        "on-primary-fixed": "#001e2f",
                        "surface-dim": "#d9dadd",
                        "tertiary": "#75565f",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#f0c8d2",
                        "surface-container-low": "#f3f3f6",
                        "surface": "#f9f9fc",
                        "primary-fixed": "#c9e6ff",
                        "on-tertiary-fixed": "#2b151c",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f0f0f4",
                        "on-secondary-fixed-variant": "#145129",
                        "secondary-fixed-dim": "#96d5a0",
                        "on-tertiary-fixed-variant": "#5b3f47",
                        "on-surface": "#191c1e",
                        "surface-container": "#edeef1",
                        "on-background": "#191c1e",
                        "secondary-fixed": "#b2f2bb",
                        "surface-container-highest": "#e1e2e5",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e1e2e5",
                        "on-secondary-container": "#357044",
                        "on-surface-variant": "#41484d",
                        "primary-container": "#a5d8ff",
                        "primary": "#2e6385",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#e4bcc6",
                        "primary-fixed-dim": "#9accf3",
                        "surface-bright": "#f9f9fc",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#70525a",
                        "tertiary-fixed": "#ffd9e2",
                        "on-secondary-fixed": "#00210b",
                        "surface-tint": "#2e6385",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2e3133",
                        "background": "#f9f9fc",
                        "outline": "#71787e",
                        "outline-variant": "#c1c7ce",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e7e8eb",
                        "secondary-container": "#b2f2bb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "20px",
                        "gutter": "12px",
                        "xl": "32px",
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "unit": "4px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "h3": ["Plus Jakarta Sans"],
                        "label-xs": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "h1": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "h3": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-xs": ["10px", {"lineHeight": "12px", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "h1": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "h2": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-shadow-l1 { box-shadow: 0 4px 20px -2px rgba(46, 99, 133, 0.05); }
        .soft-shadow-l2 { box-shadow: 0 12px 32px -4px rgba(46, 99, 133, 0.08); }
        .bottom-drawer-mask { background-color: rgba(25, 28, 30, 0.4); backdrop-filter: blur(4px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface">
<!-- Parent View Background (Mocking Schedule Behind Drawer) -->
<div class="fixed inset-0 p-container-padding">
<!-- TopAppBar (From JSON) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-5 h-16 bg-white/80 backdrop-blur-md border-b border-blue-50/50 shadow-sm shadow-blue-100/20">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-blue-400">calendar_today</span>
<h1 class="font-['Plus_Jakarta_Sans'] text-lg font-semibold tracking-tight text-on-surface">Today's Schedule</h1>
</div>
<button class="material-symbols-outlined text-blue-400 active:scale-95 transition-transform">more_vert</button>
</header>
<!-- Mock Content Canvas -->
<div class="mt-20 space-y-md">
<div class="bg-primary-container/30 p-lg rounded-xl flex items-center justify-between border border-primary-container/20">
<div class="space-y-xs">
<p class="font-h3 text-primary">钢琴 (Piano)</p>
<p class="font-label-sm text-on-primary-container">10:00 - 11:30</p>
</div>
<span class="material-symbols-outlined text-primary">drag_handle</span>
</div>
<div class="bg-secondary-container/30 p-lg rounded-xl flex items-center justify-between opacity-50">
<div class="space-y-xs">
<p class="font-h3 text-secondary">Advanced Theory</p>
<p class="font-label-sm text-on-secondary-container">14:00 - 15:30</p>
</div>
<span class="material-symbols-outlined text-secondary">drag_handle</span>
</div>
</div>
</div>
<!-- Modal Drawer Overlay -->
<div class="fixed inset-0 z-[60] flex items-end justify-center bottom-drawer-mask">
<!-- Drawer Component -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-t-[32px] soft-shadow-l2 border-t border-white/40 flex flex-col max-h-[795px]">
<!-- Handle -->
<div class="flex justify-center pt-md pb-xs">
<div class="w-10 h-1.5 bg-surface-container-highest rounded-full"></div>
</div>
<!-- Content Container -->
<div class="px-container-padding pb-xl overflow-y-auto">
<!-- Header -->
<div class="flex justify-between items-start py-md">
<div>
<h2 class="font-h1 text-on-surface">钢琴 (Piano)</h2>
<div class="flex items-center gap-xs mt-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">schedule</span>
<span class="font-body-lg">10:00 - 11:30</span>
</div>
</div>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-outline active:scale-90 transition-all">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Course Image Mock -->
<div class="relative w-full h-32 rounded-2xl overflow-hidden mb-lg">
<img alt="Piano keys close up" class="w-full h-full object-cover" data-alt="Close-up of elegant grand piano keys with soft morning light and shallow depth of field" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCC4ye6waMGQXU37Cur-jXiVCe53MllHIaeiYkEmYtMF_ywuEkDPA4Tk3QSc0SKhdH0-cNe-6O0XwxpbY-bpukprcIROsbvhFGqyf0hKUrfxS4BGBZ2tzDR3pDG3qdfSUl7hP7I6FZyHD3j8pBMehzZX9Fa_06gfnj_lZoWp7yhv2Z12QcDGXFijvNorGtsijM6_wmo2gbzpUcoPo0tpinvApPgsf3BkvWGGXukRdB4m6FfMZuaDMN-7e8TlAiS_IvtT26cqFfW6XpF"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
<!-- Reminder Setting -->
<div class="space-y-sm mb-lg">
<label class="font-label-sm text-on-surface-variant flex items-center gap-xs ml-unit">
<span class="material-symbols-outlined text-[16px]">notifications</span>
                        提醒设置
                    </label>
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center py-md rounded-xl bg-surface-container-high border border-outline-variant/30 font-body-md text-on-surface-variant hover:bg-primary-container/20 active:scale-95 transition-all">
                            不提醒
                        </button>
<button class="flex items-center justify-center py-md rounded-xl bg-surface-container-high border border-outline-variant/30 font-body-md text-on-surface-variant hover:bg-primary-container/20 active:scale-95 transition-all">
                            提前 5 分钟
                        </button>
<button class="flex items-center justify-center py-md rounded-xl bg-primary-container/50 border-2 border-primary/20 font-h3 text-primary active:scale-95 transition-all">
                            提前 10 分钟
                        </button>
<button class="flex items-center justify-center py-md rounded-xl bg-surface-container-high border border-outline-variant/30 font-body-md text-on-surface-variant hover:bg-primary-container/20 active:scale-95 transition-all">
                            提前 30 分钟
                        </button>
</div>
</div>
<!-- Remarks -->
<div class="space-y-sm mb-xl">
<label class="font-label-sm text-on-surface-variant flex items-center gap-xs ml-unit">
<span class="material-symbols-outlined text-[16px]">notes</span>
                        课程备注
                    </label>
<textarea class="w-full min-h-[100px] bg-surface-container rounded-2xl border-none focus:ring-2 focus:ring-primary-container p-md font-body-md placeholder:text-outline/60 text-on-surface resize-none" placeholder="记录课程重点，如：带琴谱"></textarea>
</div>
<!-- Footer Actions -->
<div class="space-y-md">
<button class="w-full py-md bg-primary text-on-primary font-h3 rounded-full shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                        保存设置
                    </button>
<button class="w-full py-md text-error font-h3 rounded-full hover:bg-error-container/20 active:scale-[0.98] transition-all flex items-center justify-center gap-xs">
<span class="material-symbols-outlined">delete_outline</span>
                        移出日程
                    </button>
</div>
</div>
</div>
</div>
<!-- BottomNavBar (From JSON) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-6 pt-3 bg-white/90 backdrop-blur-lg rounded-t-[32px] border-t border-blue-50/30 shadow-[0_-4px_20px_rgba(165,216,255,0.1)]">
<div class="flex flex-col items-center justify-center text-blue-500 bg-blue-50/50 rounded-2xl px-5 py-2">
<span class="material-symbols-outlined" data-weight="fill">event_note</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Schedule</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-5 py-2">
<span class="material-symbols-outlined">category</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Library</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-5 py-2">
<span class="material-symbols-outlined">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium">Profile</span>
</div>
</nav>
</body></html>
